<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>

<HEAD>
    <TITLE>Clickable Image</TITLE>

    <STYLE>

        body {
            margin: 0px;
            padding: 40px;

            background-color: #F5E6D3;

            font-family: Georgia, serif;
            color: #411900;
            text-align: center;
        }

        H1 {
            color: #411900;
        }

        .link-image {
            width: 200px;
            height: 150px;
            object-fit: contain;
            margin: 20px;
        }

    </STYLE>

</HEAD>


<BODY>

    <H1>Clickable Image</H1>

    <HR color="8A6A3F">

    <P>Click the image to visit Google.</P>

    <!-- Image Hyperlink -->

    <A HREF="https://www.google.com" TARGET="_blank">

    <IMG
        SRC="image URL"
        ALT="Google">

</A>

    <BR>

    <P>Click the image above to open Google.</P>

</BODY>

</HTML>
